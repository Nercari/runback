name: test

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  test:
    # Windows: the codec round-trip runs the real capture.ps1 decoder.
    # Linux: it runs the capture_x11.py decoder (python3 is on the runner).
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # npm test takes under a minute; a hung run should fail fast, not hold a PR for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/safety-ci.js
      - run: npm test

  # A PR adds changes/<slug>.md and leaves CHANGELOG.md to the release build
  # (tools/changelog.js). Fails when the PR edits CHANGELOG.md without also
  # bumping the package.json version, which is what a release does.
  changelog-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/changelog.js check --base "origin/$BASE_REF"
